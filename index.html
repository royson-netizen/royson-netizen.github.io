  <title>WangwanaTech | Automation with Humanity</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e17;
      --card: #131827;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --accent-green: #10b981;
      --accent-gold: #fbbf24;
      --border: #1e293b;
      --shadow: rgba(0, 0, 0, 0.35);
      --wa: #25D366;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    /* HEADER / NAV */
    header {
      background: rgba(19, 24, 39, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-green);
      color: #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 20px 5px rgba(16, 185, 129, 0.35);
      }
    }

    .logo-text {
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .logo-text span {
      color: var(--text-dim);
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.25s;
    }

    .nav-links a:hover {
      color: var(--accent-green);
    }

    .btn-launch {
      background: var(--accent-green);
      color: #000;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 900;
      text-decoration: none;
      transition: all 0.25s;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.18);
      white-space: nowrap;
    }

    .btn-launch:hover {
      background: var(--accent-gold);
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(251, 191, 36, 0.18);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 900;
      transition: 0.25s;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      border-color: rgba(16, 185, 129, 0.6);
      transform: translateY(-2px);
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 22px;
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 30px;
      align-items: center;
      margin: 10px 0 35px;
    }

    .hero-card {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(16, 185, 129, 0.08));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 20px 60px var(--shadow);
    }

    .badge {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.08);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 850;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 3rem;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--text-dim);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .hero-side {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 18px 50px var(--shadow);
    }

    .side-title {
      color: var(--accent-gold);
      font-weight: 900;
      margin-bottom: 14px;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .side-item {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-dim);
      font-weight: 650;
      margin-bottom: 10px;
    }

    .side-item strong {
      color: var(--text-main);
    }

    /* TAGLINE */
    .swahili-tagline {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(16, 185, 129, 0.12));
      border-left: 4px solid var(--accent-gold);
      padding: 22px;
      margin: 25px auto 40px;
      max-width: 980px;
      border-radius: 12px;
      text-align: center;
    }

    .swahili-tagline h2 {
      font-size: 2rem;
      color: var(--accent-gold);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .swahili-tagline p {
      color: var(--text-dim);
      font-weight: 650;
    }

    /* SECTION */
    section { margin: 70px 0; }

    .section-title {
      font-size: 2.2rem;
      margin-bottom: 14px;
      text-align: center;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 40px;
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
    }

    /* GRID */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
