<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KangwanaTech | Enterprise AI & WhatsApp Automation</title>
    <meta name="description" content="Custom WhatsApp AI automation with zero Twilio fees. Seamless Make.com CRM pipelines, Daraja M-PESA integrations, and headless WebSocket architecture built in Nairobi.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --green-dark: #059669;
            --green-light: #d1fae5;
            --green-muted: #ecfdf5;
            --ink: #0f172a;
            --slate: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --surface: #f8fafc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--white);
            color: var(--ink);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
        h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.12; font-weight: 800; }
        h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; }
        h3 { font-size: 1.25rem; font-weight: 700; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        /* ─── NOISE TEXTURE OVERLAY ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: 0.4;
        }

        /* ─── HEADER ─── */
        .header {
            padding: 1.25rem 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .container { display: flex; justify-content: space-between; align-items: center; }

        .logo {
            font-family: 'Sora', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .logo span { color: var(--green); }
        .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .nav { display: flex; align-items: center; gap: 0.25rem; }
        .nav a {
            text-decoration: none;
            color: var(--slate);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav a:hover { color: var(--green); background: var(--green-muted); }

        /* ─── BUTTONS ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--green); color: white; box-shadow: 0 2px 12px rgba(16,185,129,0.3); }
        .btn-primary:hover { background: var(--green-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.35); }
        .btn-outline { border: 1.5px solid var(--border); color: var(--ink); background: white; }
        .btn-outline:hover { border-color: var(--green); color: var(--green); background: var(--green-muted); }
        .btn-ghost { color: var(--green); background: var(--green-muted); }
        .btn-ghost:hover { background: var(--green-light); }

        /* ─── HERO ─── */
        .hero { padding: 5rem 0 4rem; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -200px; right: -200px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%); pointer-events: none; }
        .hero::after { content: ''; position: absolute; bottom: -100px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(16,185,129,0.05) 0%, transparent 70%); pointer-events: none; }

        .hero .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--green-muted);
            color: var(--green-dark);
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(16,185,129,0.2);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .hero h1 { margin-bottom: 1.25rem; color: var(--ink); }
        .hero h1 em { font-style: normal; color: var(--green); position: relative; }
        .hero h1 em::after { content: ''; position: absolute; bottom: 4px; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--green), transparent); border-radius: 2px; }

        .hero-sub { font-size: 1.1rem; color: var(--muted); margin-bottom: 2rem; max-width: 480px; line-height: 1.7; }
        .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        .whatsapp-icon { width: 20px; height: 20px; fill: currentColor; }

        .hero-stats {
            display: flex;
            gap: 2.5rem;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .stat-number { font-family: 'Sora', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--ink); line-height: 1; }
        .stat-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-top: 0.4rem; }

        /* ─── CHAT MOCKUP ─── */
        .hero-visual { position: relative; }
        .phone-frame {
            background: white;
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
            overflow: hidden;
            max-width: 350px;
            margin: 0 auto;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        .phone-status { background: #128c7e; color: white; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.6rem; }
        .wa-avatar { width: 34px; height: 34px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; }
        .wa-info { flex: 1; }
        .wa-name { font-weight: 600; font-size: 0.9rem; }
        .wa-online { font-size: 0.75rem; opacity: 0.8; }

        .chat-body {
            background: #e5ddd5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='%23e5ddd5'/%3E%3C/svg%3E");
            padding: 1rem;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .bubble { max-width: 85%; padding: 0.6rem 0.85rem; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; position: relative; }
        .bubble-in { background: white; border-bottom-left-radius: 2px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bubble-out { background: #dcf8c6; border-bottom-right-radius: 2px; align-self: flex-end; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bubble-time { font-size: 0.65rem; color: #999; text-align: right; margin-top: 0.2rem; }
        .bubble strong { color: var(--green-dark); }

        /* ─── TRUST SCROLL ─── */
        .trust-bar { background: var(--ink); padding: 1.25rem 0; overflow: hidden; }
        .trust-scroll { display: flex; gap: 3rem; animation: scroll 25s linear infinite; white-space: nowrap; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .trust-item { color: rgba(255,255,255,0.7); font-size: 0.9rem; font-weight: 600; flex-shrink: 0; }
        .trust-item span { color: var(--green); margin-right: 0.5rem; font-size: 1.1rem; }

        /* ─── SERVICES ─── */
        .services { padding: 5rem 0; background: white; }
        .section-header { text-align: center; max-width: 700px; margin: 0 auto 3.5rem; }
        .section-header h2 { margin-bottom: 0.8rem; }
        .section-header p { color: var(--muted); font-size: 1.1rem; }

        .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
        .card { background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 2.5rem; transition: all 0.25s; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--green); transform: scaleY(0); transform-origin: bottom; transition: transform 0.3s; }
        .card:hover::before { transform: scaleY(1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.12); border-color: rgba(16,185,129,0.3); }

        .card-tag { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--ink); color: white; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.2rem; }
        .card-icon { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.4rem; }
        .card p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.6; }
        .card-features { list-style: none; margin-bottom: 1.5rem; }
        .card-features li { font-size: 0.9rem; font-weight: 500; color: var(--slate); padding: 0.4rem 0; display: flex; align-items: flex-start; gap: 0.5rem; border-bottom: 1px dashed var(--border); }
        .card-features li:last-child { border-bottom: none; }
        .card-features li::before { content: "✓"; color: var(--green); font-weight: 800; margin-top: 0.05rem; flex-shrink: 0; }

        /* ─── ARCHITECTURE OVERVIEW ─── */
        .howto { background: var(--surface); padding: 5rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; position: relative; }
        .steps::before { content: ''; position: absolute; top: 36px; left: calc(12.5% + 20px); width: calc(75% - 40px); height: 2px; background: linear-gradient(90deg, var(--green), rgba(16,185,129,0.2)); z-index: 0; }
        .step { background: white; padding: 2rem 1.5rem; border-radius: 20px; border: 1.5px solid var(--border); text-align: center; position: relative; z-index: 1; transition: all 0.2s; }
        .step:hover { border-color: rgba(16,185,129,0.3); box-shadow: 0 8px 24px -8px rgba(16,185,129,0.15); }
        .step-number { width: 44px; height: 44px; background: var(--ink); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Sora', sans-serif; margin: 0 auto 1rem; box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
        .step h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
        .step p { font-size: 0.9rem; color: var(--muted); }

        /* ─── CTA ─── */
        .cta-section { padding: 5rem 0; }
        .cta-inner { background: linear-gradient(135deg, var(--ink) 0%, #1a3a2a 100%); color: white; padding: 4.5rem; border-radius: 32px; text-align: center; position: relative; overflow: hidden; }
        .cta-inner::before { content: ''; position: absolute; top: -80px; right: -80px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 60%); pointer-events: none; }
        .cta-inner h2 { color: white; margin-bottom: 1rem; position: relative; font-size: 2.5rem; }
        .cta-inner p { color: rgba(255,255,255,0.7); margin-bottom: 2.5rem; font-size: 1.15rem; position: relative; max-width: 600px; margin-inline: auto; }
        .cta-inner .btn-primary { background: var(--green); font-size: 1.05rem; padding: 1rem 2.5rem; position: relative; }

        /* ─── FOOTER ─── */
        .footer { border-top: 1px solid var(--border); padding: 2.5rem 0; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .footer-left { color: var(--muted); font-weight: 500; font-size: 0.9rem; }
        .footer-right { font-weight: 600; font-size: 0.9rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .footer-right a { color: var(--ink); text-decoration: none; transition: color 0.2s; }
        .footer-right a:hover { color: var(--green); }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .hero .container { grid-template-columns: 1fr; gap: 3rem; }
            .cards { grid-template-columns: 1fr; }
            .steps { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .steps::before { display: none; }
        }
        @media (max-width: 640px) {
            .container { padding: 0 1.25rem; }
            .steps { grid-template-columns: 1fr; }
            .cta-inner { padding: 3rem 1.5rem; }
            .hero-stats { gap: 1.5rem; flex-wrap: wrap; }
            .nav a:not(.btn) { display: none; }
        }

        /* ─── FADE IN ANIMATION ─── */
        .fade-up { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
