<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KangwanaTech | Kigo AI - The Autonomous WhatsApp Worker</title>
    <meta name="description" content="Meet Kigo: The autonomous WhatsApp AI for Kenyan SMEs, students, and communities. Zero Meta API fees, live Daraja M-PESA integration, and headless WebSocket architecture.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #10b981;
            --green-dark: #059669;
            --green-light: #d1fae5;
            --green-muted: #ecfdf5;
            --ink: #0f172a;
            --slate: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --surface: #f8fafc;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--white);
            color: var(--ink);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
        h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.12; font-weight: 800; }
        h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 700; }
        h3 { font-size: 1.25rem; font-weight: 700; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        /* ─── HEADER ─── */
        .header {
            padding: 1.25rem 0;
            background: rgba(255,255,255,0.98);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .container { display: flex; justify-content: space-between; align-items: center; }

        .logo {
            font-family: 'Sora', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }

        .logo span { color: var(--green); }
        .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .nav { display: flex; align-items: center; gap: 1.5rem; }
        .nav a.link {
            text-decoration: none;
            color: var(--slate);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .nav a.link:hover { color: var(--green); }

        /* ─── BUTTONS ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--green); color: white; }
        .btn-primary:hover { background: var(--green-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
        .btn-outline { border: 1.5px solid var(--border); color: var(--ink); background: white; }
        .btn-outline:hover { border-color: var(--green); color: var(--green); background: var(--green-muted); }

        /* ─── HERO ─── */
        .hero { padding: 5rem 0; position: relative; background: var(--surface); overflow: hidden; }

        .hero .container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            background: var(--green-muted);
            color: var(--green-dark);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(16,185,129,0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hero h1 { margin-bottom: 1.5rem; color: var(--ink); }
        .hero h1 em { font-style: normal; color: var(--green); position: relative; }

        .hero-sub { font-size: 1.1rem; color: var(--muted); margin-bottom: 2.5rem; max-width: 520px; line-height: 1.7; }
        .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

        .hero-stats {
            display: flex;
            gap: 2.5rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .stat-number { font-family: 'Sora', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--ink); line-height: 1; }
        .stat-label { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-top: 0.4rem; }

        /* ─── CHAT MOCKUP ─── */
        .phone-frame {
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid #f1f5f9;
        }

        .phone-status { background: #128c7e; color: white; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.8rem; }
        .wa-avatar { width: 36px; height: 36px; background: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; }
        .wa-info { flex: 1; }
        .wa-name { font-weight: 600; font-size: 0.95rem; line-height: 1.2;}
        .wa-online { font-size: 0.75rem; opacity: 0.9; }

        .chat-body {
            background: #e5ddd5;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .bubble { max-width: 85%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; position: relative; }
