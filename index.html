<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KangwanaTech | WhatsApp Enterprise Architecture</title>
    <meta name="description" content="The operating system for the Kenyan economy. Kigo AI automates SMEs, procurement, and civic data directly on WhatsApp.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Basecamp System Variables */
        :root {
            --bg-deep: #050505;
            --bg-surface: #0f1115;
            --text-primary: #f2f2f2;
            --text-secondary: #8b949e;
            --signal-green: #00fa9a; /* The Action Vector */
            --border-grid: #1f2328;
            --font-main: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image: 
                linear-gradient(var(--border-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-grid) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }

        /* Nav & System Status */
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-grid);
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--signal-green);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--signal-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--signal-green);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Hero Architecture */
        .hero {
            padding: 100px 5%;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
        }

        .highlight {
            color: var(--signal-green);
        }

        .thesis {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--text-secondary);
            max-width: 800px;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* The Swarm Grid */
        .grid-header {
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-grid);
            padding-bottom: 10px;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .node-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-grid);
            padding: 2.5rem 2rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .node-card:hover {
            border-color: var(--signal-green);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 250, 154, 0.05);
        }

        .node-card::before {
            content: "NODE_ACTIVE";
            position: absolute;
            top: 15px;
            right: 20px;
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--signal-green);
            opacity: 0.5;
        }

        .node-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .node-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            min-height: 80px;
        }

        .terminal-block {
            background: #000;
            border: 1px solid #222;
            padding: 1rem;
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }

        .terminal-user { color: #fff; }
        .terminal-bot { color: var(--signal-green); }

        .btn-deploy {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--signal-green);
            border: 1px solid var(--signal-green);
            text-align: center;
            text-decoration: none;
            font-family: var(--font-code);
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-deploy:hover {
            background: var(--signal-green);
            color: #000;
        }

        /* Tech Stack Footer */
        .system-specs {
            border-top: 1px solid var(--border-grid);
            padding: 4rem 5%;
            background: var(--bg-surface);
            text-align: center;
        }

        .specs-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 900px;
            margin: 2rem auto 0;
        }

        .spec-item {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 8px 16px;
            border: 1px solid var(--border-grid);
            background: var(--bg-deep);
        }

        /* Floating Action */
        .fab-whatsapp {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--text-primary);
            color: var(--bg-deep);
            padding: 15px 25px;
            text-decoration: none;
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            z-index: 1000;
            border-radius: 2px;
        }

        .fab-whatsapp:hover {
            background: var(--signal-green);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .hero { padding: 60px 5%; }
            .fab-whatsapp { bottom: 20px; right: 20px; font-size: 0.8rem; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">KANGWANA_TECH</div>
        <div class="system-status">
            <div class="pulse"></div>
            SWARM V1.0 ONLINE
        </div>
    </header>

    <section class="hero">
        <h1>The Friction Tax is Dead. <br><span class="highlight">Enter the Architecture.</span></h1>
        <p class="thesis">
            Stop building apps.
