<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kigo by KangwanaTech | AI WhatsApp Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e17;
            --card: #131827;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }

        /* HEADER / NAV */
        header {
            background: rgba(19, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Note: .logo-icon class removed as we are using an image now */

        .logo-text {
            color: var(--text-main);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .logo-text span {
            color: var(--text-dim);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        .btn-launch {
            background: var(--accent-green);
            color: #000;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            animation: breathe-button 4s ease-in-out infinite;
        }

        @keyframes breathe-button {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
            }
        }

        .btn-launch:hover {
            background: var(--accent-gold);
            transform: translateY(-2px) scale(1.05);
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        /* HERO INTRO */
        .hero-intro {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero-intro h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-intro p {
            font-size: 1.35rem;
            color: var(--text-dim);
            max-width: 850px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .swahili-tagline {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(16, 185, 129, 0.15));
            border-left: 4px solid var(--accent-gold);
            padding: 20px 30px;
            margin: 30px auto;
            max-width: 600px;
            border-radius: 10px;
        }

        .swahili-tagline h2 {
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
        }

        /* SECTION STYLING */
        .section-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 50px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* HOW IT WORKS */
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 80px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
        }

            font-size: 1.8rem;
            margin-bottom: 30
